[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "daemonos"
version = "0.1.0"
description = "AI-native, headless execution operating system and device-management stack"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "TheBabelDragon" }]
dependencies = [
    "pydantic>=2.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "httpx>=0.27",
    "cryptography>=42.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.3",
    "mypy>=1.8",
    "types-requests",
]

[project.scripts]
daemonos = "daemonos.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/daemonos"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["daemonos"]
